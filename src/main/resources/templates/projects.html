<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('projects')}"></div>

<main class="container">
    <h1 class="page-title">Projects</h1>
    <p class="page-subtitle">Things I've built and what I used to build them.</p>

    <section class="grid">
        <article class="card" th:each="project : ${projects}">
            <h2><a class="card-link" th:href="@{/projects/{slug}(slug=${project.slug})}" th:text="${project.title}">Project title</a></h2>            <p th:text="${project.summary}">Summary</p>
            <div class="tags">
                <span class="tag" th:each="skill : ${project.skills}" th:text="${skill}">Skill</span>
            </div>
        </article>
    </section>
</main>
</body>
</html>
