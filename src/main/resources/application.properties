spring.application.name=portfolio-web-app

# Read DB_NAME, DB_USER, DB_PASSWORD from the .env file
spring.config.import=optional:file:.env[.properties]

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway creates the tables; Hibernate only checks they match the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false